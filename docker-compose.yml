services:
  postgres:
    image: postgres:16-alpine
    container_name: linkedin-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linkedin_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - linkedin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkedin-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080

      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=linkedin_dev;Username=postgres;Password=postgres

      - JwtSettings__SecretKey=docker-development-secret-key-min-32-characters-for-testing
      - JwtSettings__Issuer=LinkedInAPI
      - JwtSettings__Audience=LinkedInClients
      - JwtSettings__AccessTokenExpirationMinutes=60
      - JwtSettings__RefreshTokenExpirationDays=30
    ports:
      - "5000:8080"
    volumes:
      - profile_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - linkedin-network
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    container_name: linkedin-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ""
      # Inside Docker network the API host is the service name `api`.
      VITE_DEV_PROXY_TARGET: http://api:8080
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - api
    networks:
      - linkedin-network
    restart: unless-stopped

networks:
  linkedin-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  profile_uploads:
    driver: local
  frontend_node_modules:
    driver: local