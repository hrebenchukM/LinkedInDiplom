<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinkUp SPA</title>
  <script>
    (function () {
      var lang = localStorage.getItem("uiLang");
      if (lang !== "en" && lang !== "ru" && lang !== "uk") lang = "ru";
      document.documentElement.lang = lang;
      document.documentElement.dataset.lang = lang;
      var theme = localStorage.getItem("uiTheme");
      if (theme !== "dark" && theme !== "light") theme = "light";
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme === "dark" ? "dark" : "light";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./shared/styles/theme.css" />
  <link rel="stylesheet" href="./auth/styles.css" />
  <link rel="stylesheet" href="./shared/styles/home.css?v=20260526-3" />
  <link rel="stylesheet" href="./pages/home/styles.css?v=20260526-3" />
  <link rel="stylesheet" href="./shared/styles/vacancies.css?v=20260526-3" />
  <link rel="stylesheet" href="./shared/styles/chat.css" />
  <link rel="stylesheet" href="./spa/styles.css?v=1" />
</head>
<body class="home-body">
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="./vendor/remix-router.umd.js?v=1"></script>
  <script src="./vendor/react-router.development.js?v=1"></script>
  <script src="./vendor/react-router-dom.development.js?v=2"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="./shared/scripts/i18n.js?v=20260526-3"></script>
  <script src="./shared/scripts/theme.js"></script>
  <script src="./spa/storage.js?v=1"></script>
  <script>
    (function () {
      var root = document.getElementById("root");
      function fail(text) {
        if (!root) return;
        root.innerHTML = '<main class="empty-state"><h1>Startup error</h1><p>' + text + "</p></main>";
      }
      window.addEventListener("error", function (e) {
        fail("JS error: " + (e && e.message ? e.message : "unknown"));
      });
      window.addEventListener("unhandledrejection", function (e) {
        var reason = e && e.reason ? (e.reason.message || String(e.reason)) : "unknown";
        fail("Promise error: " + reason);
      });
      if (!window.React || !window.ReactDOM || !window.Babel) {
        fail("Не удалось загрузить React/CDN зависимости. Проверьте интернет и обновите страницу.");
        return;
      }
      if (!window.ReactRouter || !window.RemixRouter) {
        fail("Не удалось загрузить ReactRouter/RemixRouter (local vendor).");
        return;
      }
      if (!window.ReactRouterDOM || !window.ReactRouterDOM.Routes) {
        fail("Не удалось загрузить ReactRouterDOM (local vendor).");
        return;
      }
      var app = document.createElement("script");
      app.type = "text/babel";
      app.src = "./spa/app.jsx?v=7";
      app.onerror = function () {
        fail("Не удалось загрузить spa/app.jsx");
      };
      document.body.appendChild(app);
    })();
  </script>
</body>
</html>
